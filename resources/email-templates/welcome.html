<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to MyOnlineJoker</title>
</head>
<body style="margin:0;background:#0D1117;font-family:Arial,Helvetica,sans-serif;color:#E6EDF3;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" style="max-width:480px;background:#161B22;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#D4AF37;padding:24px;text-align:center;">
              <h1 style="margin:0;color:#0D1117;font-size:24px;">MyOnlineJoker</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 24px;">
              <h2 style="margin:0 0 12px;color:#D4AF37;">Welcome, {{username}}!</h2>
              <p style="line-height:1.6;color:#9DA7B3;">
                Your account is ready. Play Teen Patti and Aviator, climb the
                leaderboard, and invite friends with your referral code
                <strong style="color:#D4AF37;">{{referralCode}}</strong> to earn bonuses.
              </p>
              <p style="text-align:center;margin:28px 0;">
                <a href="{{appUrl}}" style="background:#00C853;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;display:inline-block;">Open App</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#0D1117;text-align:center;color:#6B7280;font-size:12px;">
              Play responsibly. 18+ only.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
