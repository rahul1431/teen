version: '3.9'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: test_postgres_lb
    restart: unless-stopped
    environment:
      POSTGRES_USER: teen
      POSTGRES_PASSWORD: teen_secret_2024
      POSTGRES_DB: teen_db
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teen -d teen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: test_redis_lb
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass teen_redis_2024
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --tcp-backlog 511
      --hz 20
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "teen_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_network

  # Nginx Load Balancer
  nginx:
    image: nginx:latest
    container_name: test_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/load-balancer.conf:/etc/nginx/conf.d/load-balancer.conf
      - ./infra/nginx/proxy-headers.conf:/etc/nginx/snippets/proxy-headers.conf
    depends_on:
      - gateway1
      - gateway2
      - gateway3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - gateway_network
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y curl &&
        nginx -g 'daemon off;'
      "

  # Game Gateway Instance 1
  gateway1:
    build:
      context: .
      dockerfile: services/game-gateway/Dockerfile
    container_name: test_gateway1
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
      DATABASE_URL: postgresql://teen:teen_secret_2024@postgres:5432/teen_db
      REDIS_URL: redis://:teen_redis_2024@redis:6379
      JWT_SECRET: cluster_jwt_secret_min_32_characters_long
      WALLET_SERVICE_URL: http://localhost:3003
      INTERNAL_SERVICE_KEY: cluster_internal_key_2024
      BOT_FILL_ENABLED: 'true'
      BOT_FILL_DELAY_SECONDS: 10
      MAX_BOT_RATIO: 0.6
      TEEN_PATTI_ENGINE_URL: localhost:50051
      LUDO_ENGINE_URL: http://127.0.0.1:3011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - gateway_network

  # Game Gateway Instance 2
  gateway2:
    build:
      context: .
      dockerfile: services/game-gateway/Dockerfile
    container_name: test_gateway2
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: development
      DATABASE_URL: postgresql://teen:teen_secret_2024@postgres:5432/teen_db
      REDIS_URL: redis://:teen_redis_2024@redis:6379
      JWT_SECRET: cluster_jwt_secret_min_32_characters_long
      WALLET_SERVICE_URL: http://localhost:3003
      INTERNAL_SERVICE_KEY: cluster_internal_key_2024
      BOT_FILL_ENABLED: 'true'
      BOT_FILL_DELAY_SECONDS: 10
      MAX_BOT_RATIO: 0.6
      TEEN_PATTI_ENGINE_URL: localhost:50051
      LUDO_ENGINE_URL: http://127.0.0.1:3011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - gateway_network

  # Game Gateway Instance 3
  gateway3:
    build:
      context: .
      dockerfile: services/game-gateway/Dockerfile
    container_name: test_gateway3
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      NODE_ENV: development
      DATABASE_URL: postgresql://teen:teen_secret_2024@postgres:5432/teen_db
      REDIS_URL: redis://:teen_redis_2024@redis:6379
      JWT_SECRET: cluster_jwt_secret_min_32_characters_long
      WALLET_SERVICE_URL: http://localhost:3003
      INTERNAL_SERVICE_KEY: cluster_internal_key_2024
      BOT_FILL_ENABLED: 'true'
      BOT_FILL_DELAY_SECONDS: 10
      MAX_BOT_RATIO: 0.6
      TEEN_PATTI_ENGINE_URL: localhost:50051
      LUDO_ENGINE_URL: http://127.0.0.1:3011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - gateway_network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  gateway_network:
    driver: bridge
