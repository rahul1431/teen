version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teen
      POSTGRES_PASSWORD: teen_secret_2024
      POSTGRES_DB: teen_db
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teen -d teen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teen_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass teen_redis_2024
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --tcp-backlog 511
      --hz 20
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "teen_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
