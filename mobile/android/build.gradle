allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    def configureNamespace = { prj ->
        if (prj.hasProperty("android")) {
            prj.android {
                if (namespace == null) {
                    namespace = "com.example.${prj.name.replaceAll(/[_-]/, '')}"
                }
            }
            // Strip package attribute from AndroidManifest.xml to satisfy AGP 8+
            try {
                def manifestFile = prj.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def content = manifestFile.text
                    if (content.contains("package=")) {
                        prj.logger.lifecycle("Stripping package attribute from ${prj.name} manifest")
                        content = content.replaceAll(/package="[^"]*"/, "")
                        manifestFile.text = content
                    }
                }
            } catch (Exception e) {
                prj.logger.warn("Failed to check/strip manifest package for ${prj.name}: ${e.message}")
            }
        }
    }
    if (project.state.executed) {
        configureNamespace(project)
    } else {
        project.afterEvaluate {
            configureNamespace(project)
        }
    }
}

