plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.myonlinejoker.app"
    compileSdk = 35
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    def isAgentApp = project.hasProperty("agentApp") || (project.hasProperty("target") && project.property("target").contains("agent"))

    defaultConfig {
        // Player App: com.teenpatti.game | Agent App: com.myonlinejoker.agent (enables side-by-side install)
        applicationId = isAgentApp ? "com.myonlinejoker.agent" : "com.teenpatti.game"
        resValue "string", "app_name", isAgentApp ? "Joker Agent" : "MyOnlineJoker"
        minSdkVersion = 23
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Apply Google Services only when google-services.json is present, so PR builds
// without the secret still succeed.
// Apply Google Services for Player App only (Agent App does not require Firebase)
def isAgentBuild = project.hasProperty("agentApp") || (project.hasProperty("target") && project.property("target").toString().contains("agent"))
if (file("google-services.json").exists() && !isAgentBuild) {
    apply plugin: "com.google.gms.google-services"
}



configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.15.0"
        force "androidx.core:core-ktx:1.15.0"
        force "androidx.activity:activity:1.9.3"
        force "androidx.activity:activity-ktx:1.9.3"
        force "androidx.fragment:fragment:1.8.5"
        force "androidx.fragment:fragment-ktx:1.8.5"
        force "androidx.browser:browser:1.8.0"
        force "androidx.lifecycle:lifecycle-common:2.8.7"
        force "androidx.lifecycle:lifecycle-runtime:2.8.7"
        force "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    }
}

project.tasks.configureEach { task ->
    if (task.name.contains("AarMetadata")) {
        task.enabled = false
    }
}