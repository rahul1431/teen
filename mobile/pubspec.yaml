name: myonlinejoker
description: MyOnlineJoker Gaming Platform
version: 1.3.11+4205

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Image picking (deposit payment-proof screenshots)
  image_picker: ^1.1.2

  # Realtime transport — raw WebSocket (replaced Socket.IO, whose Dart client
  # crashed on-device before connecting).
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Payments
  razorpay_flutter: ^1.3.6

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.0
  flutter_local_notifications: ^17.2.2

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Sound effects (dice, chips, cashout, win/lose cues across all games)
  audioplayers: ^6.1.0
  fl_chart: ^0.68.0

  # Deep links
  app_links: ^6.3.2

  # Utils
  get_it: ^8.0.0
  intl: ^0.19.0
  share_plus: ^10.0.2
  gal: ^2.3.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  uuid: ^4.4.2
  crypto: ^3.0.3
  device_info_plus: ^10.1.2
  geolocator: ^13.0.1

  # Language + preferences
  shared_preferences: ^2.3.2

  # Biometric authentication
  local_auth: ^2.3.0

  # QR code generation (manual UPI payment gateway)
  qr_flutter: ^4.1.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/sounds/Ludo King Orginal Sound With licensed/
