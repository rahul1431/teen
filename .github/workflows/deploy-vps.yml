name: Deploy Platform to VPS (64.204.130.181)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint and Type Check
        run: npm run lint

      - name: Build Admin Panel & Services
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '64.204.130.181' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Automated Deployment on VPS (64.204.130.181)..."
            cd /opt/myonlinejoker || cd /var/www/myonlinejoker || cd ~/myonlinejoker || exit 1
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            
            echo "📦 Installing workspace dependencies..."
            npm install --production=false
            
            echo "🔨 Building admin panel & services..."
            npm run build
            
            echo "🔄 Restarting PM2 ecosystem services..."
            if command -v pm2 &> /dev/null; then
              pm2 reload ecosystem.config.js || pm2 restart ecosystem.config.js || pm2 restart all
              pm2 save
            else
              echo "⚠️ PM2 not found on PATH, attempting global npx pm2..."
              npx pm2 reload ecosystem.config.js || npx pm2 restart ecosystem.config.js
            fi
            
            echo "✅ Deployment completed successfully!"
