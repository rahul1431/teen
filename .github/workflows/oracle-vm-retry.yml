name: Oracle A1 VM Auto-Retry

on:
  schedule:
    # Backup heartbeat: triggers every 15 min if chain is ever interrupted
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI / API

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # Kill if stuck

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OCI SDK
        run: pip install oci requests

      - name: Write OCI config
        env:
          OCI_USER_OCID:        ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID:     ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT:      ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:      ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION:           ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Run Oracle VM creation script
        id: retry
        env:
          OCI_COMPARTMENT_ID:   ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID:        ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID:         ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY:   ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_REGION:           ${{ secrets.OCI_REGION }}
        run: python scripts/oracle_vm_retry.py

      - name: Trigger Next Run (Continuous Loop)
        if: steps.retry.outputs.vm_created != 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "VM not yet created. Self-triggering next run immediately..."
          curl -s -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: Continuous-Runner" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/oracle-vm-retry.yml/dispatches \
            -d "{\"ref\":\"${{ github.ref }}\"}"
          echo "Next run dispatched successfully!"
