# ── Telegram bot webhook (Telegram calls this path directly, no /api prefix) ──
location /telegram/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── WebSocket: Aviator Engine (longer prefix wins) ──
# proxy_pass_header lines are REQUIRED: without them Hestia's nginx strips
# the upgrade response headers, real WS clients reject the 101 handshake,
# and every game shows "connection lost" (broke live on 2026-07-06).
location /ws/aviator {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Game Gateway ──
location /ws {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Admin Notifications (longer prefix wins over bare /ws) ──
location /ws/admin {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── Admin Panel (React SPA) ──
location /admin {
    alias /opt/teen/admin-panel/dist;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
}

# ── User uploads ──
location /uploads/ {
    alias /opt/teen/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    location /uploads/kyc/ {
        deny all;
        return 403;
    }
}

# ── Static resources ──
location /resources/ {
    alias /opt/teen/resources/;
    expires 1h;
}

# ── Referral landing page ──
location /join {
    alias /opt/teen/infra/web/join/;
    try_files $uri $uri/ /opt/teen/infra/web/join/index.html;
    add_header Cache-Control "no-cache";
}

# ── APK download ──
# ^~ required: the HestiaCP-managed vhost template (nginx.ssl.conf, panel-
# regenerated, not this file) has a regex location matching .apk among
# other static extensions with `expires max`. Regex locations win over
# plain prefix locations in nginx regardless of which file declares them,
# so without ^~ this block is silently shadowed by that one — which is
# exactly what happened here: this block never existed in this file, so
# every /downloads/ request fell through to the regex block, which itself
# only produced correct bytes because of a manually-created, untracked
# symlink from the docroot into /opt/teen/downloads. That symlink is now
# unnecessary but harmless to leave in place.
location ^~ /downloads/ {
    alias /opt/teen/downloads/;
    add_header Content-Disposition 'attachment; filename="MyOnlineJoker.apk"';
    # The APK is served from one mutable, unversioned URL — every new
    # upload overwrites the same file — so a long max-age would let any
    # caching layer keep handing out a stale build. Always revalidate;
    # nginx still answers 304s off ETag/Last-Modified so this stays cheap.
    add_header Cache-Control "no-cache, must-revalidate";
}

# ── Block internal routes ──
location /internal/ {
    deny all;
    return 403;
}
