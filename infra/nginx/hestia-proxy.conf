# Hestia CP Nginx Custom Configuration
# Location: /home/[HESTIA_USER]/conf/web/game.myonlinejoker.com/nginx.conf_proxy
# Or paste into Hestia → Web → Edit Domain → Advanced Options → Custom Nginx Config

# REST API proxy rules
location /api/auth/ {
    rewrite ^/api/auth/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/users/ {
    rewrite ^/api/users/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/wallet/ {
    rewrite ^/api/wallet/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/leaderboard/ {
    rewrite ^/api/leaderboard/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /api/notifications/ {
    rewrite ^/api/notifications/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /api/admin/ {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Betting games (Matka, Lottery, Cricket) — REST on the betting-service.
location /api/betting/ {
    rewrite ^/api/betting/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket: Aviator Engine (raw ws). Must precede /ws so the longer prefix wins.
location /ws/aviator {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# WebSocket: Game Gateway (Teen Patti, etc., raw ws)
location /ws {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Admin Panel (React SPA)
location /admin {
    alias /opt/teen/admin-panel/dist;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
}

# Publicly served user uploads (avatars, banners, game assets)
location /uploads/ {
    alias /opt/teen/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    # KYC documents contain PII — never expose them publicly.
    location /uploads/kyc/ {
        deny all;
        return 403;
    }
}

# Static shared resources (banners, public game configs)
location /resources/ {
    alias /opt/teen/resources/;
    expires 1h;
}

# Block internal routes from public access
location /internal/ {
    deny all;
    return 403;
}
