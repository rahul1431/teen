# HestiaCP Nginx Custom Configuration
# File placed at: /home/admin/conf/web/game.myonlinejoker.com/nginx.conf_api
#                 /home/admin/conf/web/game.myonlinejoker.com/nginx.ssl.conf_api
# All 5 consolidated services (auth + users + leaderboard + notifications + betting)
# now run on core-api-service at port 3001.

# ── Auth ──
location /api/auth/ {
    rewrite ^/api/auth/(.*) /auth/$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Users ──
location /api/users/ {
    rewrite ^/api/users/(.*) /users/$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Wallet ──
location /api/wallet/ {
    rewrite ^/api/wallet/(.*) /wallet/$1 break;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Leaderboard ──
location /api/leaderboard/ {
    rewrite ^/api/leaderboard/(.*) /leaderboard/$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── Notifications ──
location /api/notifications/ {
    rewrite ^/api/notifications/(.*) /notifications/$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── Support ──
location /api/support/ {
    rewrite ^/api/support/(.*) /support/$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Admin Service ──
location /api/admin/ {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Public app version endpoint ──
location /api/app/ {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── App Monitor SDK ──
location /api/monitor/ {
    proxy_pass http://127.0.0.1:3015;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Betting (Matka, Lottery, Cricket) → core-api ──
location /api/betting/ {
    rewrite ^/api/betting/(.*) /$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── WebSocket: Aviator Engine (longer prefix wins) ──
location /ws/aviator {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Game Gateway ──
location /ws {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── Admin Panel (React SPA) ──
location /admin {
    alias /opt/teen/admin-panel/dist;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
}

# ── User uploads ──
location /uploads/ {
    alias /opt/teen/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    location /uploads/kyc/ {
        deny all;
        return 403;
    }
}

# ── Static resources ──
location /resources/ {
    alias /opt/teen/resources/;
    expires 1h;
}

# ── Block internal routes ──
location /internal/ {
    deny all;
    return 403;
}
