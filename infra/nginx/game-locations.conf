# Shared location blocks for game.myonlinejoker.com.conf's HTTP and HTTPS
# server blocks (avoids duplicating every route between the two). Deployed
# to /etc/nginx/snippets/game-locations.conf by bootstrap-vps.sh/
# deploy-services.sh's non-HestiaCP branch. Not used on the live HestiaCP
# deploy path — see infra/nginx/hestia-proxy.conf for that.

# ── Auth ──
location /api/auth/ {
    rewrite ^/api/auth/(.*) /auth/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Users ──
location /api/users/ {
    rewrite ^/api/users/(.*) /users/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Wallet ──
location /api/wallet/ {
    rewrite ^/api/wallet/(.*) /wallet/$1 break;
    proxy_pass http://wallet_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Leaderboard ──
location /api/leaderboard/ {
    rewrite ^/api/leaderboard/(.*) /leaderboard/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Game configs (public read for mobile's config-reload feature) ──
location /api/game-configs/ {
    rewrite ^/api/game-configs/(.*) /game-configs/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Notifications ──
location /api/notifications/ {
    rewrite ^/api/notifications/(.*) /notifications/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Support ──
location /api/support/ {
    rewrite ^/api/support/(.*) /support/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Betting (matka / lottery / cricket) ──
location /api/betting/ {
    rewrite ^/api/betting/(.*) /$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Product Analytics (events + feature flags) → core-api ──
location /api/analytics/ {
    rewrite ^/api/analytics/(.*) /$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Telegram (deep-link + bot webhook) → core-api ──
location /api/telegram/ {
    rewrite ^/api/telegram/(.*) /telegram/$1 break;
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Telegram bot webhook (Telegram calls this path directly, no /api prefix) ──
location /telegram/ {
    proxy_pass http://core_api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── WebSocket: Aviator Engine (longer prefix wins) ──
# proxy_pass_header Sec-WebSocket-Accept + proxy_buffering off: without these,
# some proxies strip/buffer the 101 handshake response and real WS clients
# reject the upgrade (see the same hardening in hestia-proxy.conf, added
# after the 2026-07-06 outage on that config).
location /ws/aviator {
    proxy_pass http://aviator_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Bingo Engine (longer prefix wins) ──
location /ws/bingo {
    proxy_pass http://bingo_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Admin Notifications (longer prefix wins) ──
location /ws/admin {
    proxy_pass http://admin_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── WebSocket: Game Gateway ──
location /ws {
    proxy_pass http://gateway_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass_header Upgrade;
    proxy_pass_header Connection;
    proxy_pass_header Sec-WebSocket-Accept;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── Admin Service ──
location /api/admin/ {
    proxy_pass http://admin_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Public app version endpoint ──
location /api/app/ {
    proxy_pass http://admin_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── App Monitor SDK — only the mobile ingest endpoint is public.
# Everything else on this service (live GPS, phone numbers, PM2/Docker
# state) must go through admin-service's authenticated proxy over
# loopback, never directly from the internet. See
# docs/Bugs/app-monitor-read-endpoints-publicly-unauthenticated.md.
location = /api/monitor/events {
    proxy_pass http://app_monitor_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ── Admin Panel (React build) ──
location /admin/ {
    alias /opt/teen-prod/admin-panel/dist/;
    try_files $uri $uri/ /admin/index.html;
}

# ── Friends-table invite page (/table/<CODE>) ──
location /table {
    alias /opt/teen-prod/infra/web/table/;
    try_files $uri $uri/ /table/index.html;
    add_header Cache-Control "no-cache";
}

# ── Referral landing page ──
location /join {
    alias /opt/teen-prod/infra/web/join/;
    try_files $uri $uri/ /opt/teen-prod/infra/web/join/index.html;
    add_header Cache-Control "no-cache";
}

# ── APK download ──
# ^~ is required: the HestiaCP-managed vhost template (nginx.ssl.conf,
# regenerated by the panel — not this file) has a regex location
# matching .apk among other static extensions with `expires max`. Regex
# locations win over plain prefix locations in nginx regardless of which
# config file declares them, so without ^~ this block is silently
# shadowed and requests fall through to that block instead — serving a
# 10-year-cacheable response and (if the docroot copy ever drifts) stale
# bytes, even though this alias correctly points at the upload target.
location ^~ /downloads/ {
    alias /opt/teen-prod/downloads/;
    add_header Content-Disposition 'attachment; filename="MyOnlineJoker.apk"';
    # The APK is served from one mutable, unversioned URL — every new
    # upload overwrites the same file — so a long max-age would let any
    # caching layer keep handing out a stale build. Always revalidate;
    # nginx still answers 304s off ETag/Last-Modified so this stays cheap.
    add_header Cache-Control "no-cache, must-revalidate";
}

# ── User uploads ──
location /uploads/ {
    alias /opt/teen-prod/uploads/;
    add_header Cache-Control "private, max-age=86400";
}

# ── Health check ──
location /health {
    add_header Content-Type application/json;
    return 200 '{"status":"ok","domain":"game.myonlinejoker.com"}';
}

# ── Block internal routes ──
location /internal/ {
    deny all;
    return 403;
}
