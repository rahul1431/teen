upstream auth_backend       { server 127.0.0.1:3001; }
upstream user_backend       { server 127.0.0.1:3002; }
upstream wallet_backend     { server 127.0.0.1:3003; }
upstream gateway_backend    { server 127.0.0.1:3004; }
upstream aviator_backend    { server 127.0.0.1:3005; }
upstream lb_backend         { server 127.0.0.1:3006; }
upstream notify_backend     { server 127.0.0.1:3007; }
upstream tp_engine          { server 127.0.0.1:3010; }
upstream admin_backend       { server 127.0.0.1:3008; }
upstream app_monitor_backend { server 127.0.0.1:3015; }

server {
    listen 80;
    server_name game.myonlinejoker.com;

    # HTTPS redirect (enable after SSL is set up)
    # return 301 https://$host$request_uri;

    # --- REST API Routes ---
    location /api/auth/ {
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass http://auth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users/ {
        rewrite ^/api/users/(.*) /$1 break;
        proxy_pass http://user_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/wallet/ {
        rewrite ^/api/wallet/(.*) /$1 break;
        proxy_pass http://wallet_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/leaderboard/ {
        rewrite ^/api/leaderboard/(.*) /$1 break;
        proxy_pass http://lb_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/notifications/ {
        rewrite ^/api/notifications/(.*) /$1 break;
        proxy_pass http://notify_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # --- WebSocket: Aviator Engine (raw ws). Must precede /ws so the longer
    #     prefix wins. ---
    location /ws/aviator {
        proxy_pass http://aviator_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- WebSocket: Game Gateway (Teen Patti, etc., raw ws) ---
    location /ws {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Admin Service (admin panel API) ---
    location /api/admin/ {
        proxy_pass http://admin_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # --- App Monitor SDK — Flutter event ingest (no auth at nginx level; service validates x-monitor-key) ---
    location /api/monitor/ {
        proxy_pass http://app_monitor_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # --- Admin Panel (React build) ---
    location /admin/ {
        alias /opt/teen/admin-panel/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- Health check ---
    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","domain":"game.myonlinejoker.com"}';
    }

    # --- Block sensitive internal routes from public ---
    location /internal/ {
        deny all;
        return 403;
    }
}

