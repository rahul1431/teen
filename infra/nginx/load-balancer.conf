# NOT DEPLOYED — reference design for the Docker Compose topology in
# docker-compose.load-balancer.yml (see LOAD_BALANCING.md). Do not apply
# this file directly to the live VPS: it's a standalone server block (not
# an includable snippet), has no SSL config for the HTTPS-only live site,
# hashes on the Authorization header (browsers can't set that on a
# WebSocket upgrade — the real client sends the token as a ?token= query
# param), and its 3-instance pool ports (3004/3005/3006) collide with the
# live Aviator engine (3005) and risk-service (3006) on the actual VPS.
# The production gateway pool actually live at game.myonlinejoker.com is
# instead defined in infra/nginx/game.myonlinejoker.com.conf, adapted to
# the real bare-PM2 deployment on ports 3004/3021/3022.
#
# Load Balancer Configuration for Game Gateway
# 3 instances with consistent hashing, health checks, and failover
# Health check interval: 5s, timeout: 2s, unhealthy threshold: 3, recovery threshold: 3

# ── Extract player ID from JWT token ──
# Map Authorization header (Bearer token) to a value we can use for consistent hashing
map $http_authorization $jwt_token {
    default "";
    ~Bearer\ (.+) $1;
}

# ── Decode player ID from JWT for consistent hashing ──
# Use the entire JWT token as the hash key for consistent routing
map $jwt_token $player_hash_key {
    default $remote_addr;  # Fallback to IP if no token
    ~.+ $jwt_token;        # Use token if present (full JWT)
}

# ── Gateway Upstream Backends ──
upstream gateway_backend_pool {
    # Enable consistent hashing for session affinity (same player → same instance)
    hash $player_hash_key consistent;

    # 3 Gateway instances with proper health check configuration
    # max_fails: number of failures before marking as down
    # fail_timeout: time window for counting failures
    server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3006 max_fails=3 fail_timeout=10s;

    # Keep-alive connections to reduce latency and connection overhead
    keepalive 64;
}

# ── HTTP Routing Rules ──
server {
    listen 80;
    server_name game.myonlinejoker.com;

    # Note: JWT extraction maps are defined at upstream level for consistency

    # ── Auth ──
    location /api/auth/ {
        rewrite ^/api/auth/(.*) /auth/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Users ──
    location /api/users/ {
        rewrite ^/api/users/(.*) /users/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Wallet ──
    location /api/wallet/ {
        rewrite ^/api/wallet/(.*) /wallet/$1 break;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Leaderboard ──
    location /api/leaderboard/ {
        rewrite ^/api/leaderboard/(.*) /leaderboard/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Game configs (public read for mobile's config-reload feature) ──
    location /api/game-configs/ {
        rewrite ^/api/game-configs/(.*) /game-configs/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Notifications ──
    location /api/notifications/ {
        rewrite ^/api/notifications/(.*) /notifications/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Support ──
    location /api/support/ {
        rewrite ^/api/support/(.*) /support/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Betting (matka / lottery / cricket) ──
    location /api/betting/ {
        rewrite ^/api/betting/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Telegram (deep-link + bot webhook) → core-api ──
    location /api/telegram/ {
        rewrite ^/api/telegram/(.*) /telegram/$1 break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Telegram bot webhook (Telegram calls this path directly, no /api prefix) ──
    location /telegram/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── WebSocket: Aviator Engine (longer prefix wins) ──
    location /ws/aviator {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_header Upgrade;
        proxy_pass_header Connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── WebSocket: Game Gateway (Load Balanced) ──
    # Routes to one of 3 gateway instances using consistent hashing (session affinity)
    # Consistent hashing: hash($player_hash_key) % num_instances ensures session affinity
    # If a player reconnects, they always go to the same gateway instance
    location /ws {
        proxy_pass http://gateway_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_header Upgrade;
        proxy_pass_header Connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Gateway-Instance $upstream_addr;  # Track which instance handled connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ── Admin Service ──
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3008;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Public app version endpoint ──
    location /api/app/ {
        proxy_pass http://127.0.0.1:3008;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── App Monitor SDK — only the mobile ingest endpoint is public.
    # Everything else on this service (live GPS, phone numbers, PM2/Docker
    # state) must go through admin-service's authenticated proxy over
    # loopback, never directly from the internet. See
    # docs/Bugs/app-monitor-read-endpoints-publicly-unauthenticated.md.
    location = /api/monitor/events {
        proxy_pass http://127.0.0.1:3015;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ── Admin Panel (React build) ──
    location /admin/ {
        alias /opt/teen-prod/admin-panel/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Friends-table invite page (/table/<CODE>) ──
    location /table {
        alias /opt/teen-prod/infra/web/table/;
        try_files $uri $uri/ /table/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Referral landing page ──
    location /join {
        alias /opt/teen-prod/infra/web/join/;
        try_files $uri $uri/ /opt/teen-prod/infra/web/join/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── APK download ──
    # ^~ is required: the HestiaCP-managed vhost template (nginx.ssl.conf,
    # regenerated by the panel — not this file) has a regex location
    # matching .apk among other static extensions with `expires max`. Regex
    # locations win over plain prefix locations in nginx regardless of which
    # config file declares them, so without ^~ this block is silently
    # shadowed and requests fall through to that block instead — serving a
    # 10-year-cacheable response and (if the docroot copy ever drifts) stale
    # bytes, even though this alias correctly points at the upload target.
    location ^~ /downloads/ {
        alias /opt/teen-prod/downloads/;
        add_header Content-Disposition 'attachment; filename="MyOnlineJoker.apk"';
        # The APK is served from one mutable, unversioned URL — every new
        # upload overwrites the same file — so a long max-age would let any
        # caching layer keep handing out a stale build. Always revalidate;
        # nginx still answers 304s off ETag/Last-Modified so this stays cheap.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── User uploads ──
    location /uploads/ {
        alias /opt/teen-prod/uploads/;
        add_header Cache-Control "private, max-age=86400";
    }

    # ── Health check for load balancer ──
    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","domain":"game.myonlinejoker.com","service":"load-balancer"}';
    }

    # ── Gateway health check endpoint (internal) ──
    location /gateway/health {
        proxy_pass http://gateway_backend_pool/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 2s;
        proxy_connect_timeout 2s;
    }

    # ── Internal test endpoints (load balancer testing only) ──
    # These are only used during development/testing, should be blocked in production
    location /internal/test-session {
        proxy_pass http://gateway_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/session/ {
        proxy_pass http://gateway_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Block other internal routes ──
    location /internal/ {
        deny all;
        return 403;
    }
}
