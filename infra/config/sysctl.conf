# Network tuning for 1000+ CCU WebSocket/HTTP server
# Apply with: sudo sysctl -p /opt/teen/infra/config/sysctl.conf
# Or copy to /etc/sysctl.d/99-teen.conf and run: sudo sysctl --system

# Increase socket connection backlog
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 2048

# Reuse TIME_WAIT sockets for new connections
net.ipv4.tcp_tw_reuse = 1

# Faster teardown of idle connections
net.ipv4.tcp_fin_timeout = 15

# Increase ephemeral port range
net.ipv4.ip_local_port_range = 1024 65535

# Increase read/write socket buffers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Keep-alive tuning for long-lived WebSocket connections
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
